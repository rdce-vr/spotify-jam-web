services:
  spotify-jam:
    image: spotify-jam-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-jam-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - REDIRECT_URI=${REDIRECT_URI:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - HOST_IP=${HOST_IP:-}
    volumes:
      # Persists Spotify Developer App credentials across restarts
      - ./server/.env:/app/server/.env

  # Cloudflare Named Tunnel (Using your Cloudflare Zero Trust Token)
  # Run with: docker compose --profile tunnel up -d
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: spotify-jam-cloudflare
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - spotify-jam
    profiles:
      - tunnel

  # Cloudflare Quick Tunnel (Free, instant https://*.trycloudflare.com URL with NO login or domain needed)
  # Run with: docker compose --profile quick-tunnel up -d
  cloudflare-quick:
    image: cloudflare/cloudflared:latest
    container_name: spotify-jam-quick-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://spotify-jam:5000
    depends_on:
      - spotify-jam
    profiles:
      - quick-tunnel
