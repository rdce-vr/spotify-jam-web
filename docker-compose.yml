services:
  spotify-jam:
    image: spotify-jam-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-jam-web
    restart: unless-stopped
    ports:
      - "37685:37685"
    environment:
      - PORT=37685
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - REDIRECT_URI=${REDIRECT_URI:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - HOST_IP=${HOST_IP:-}
    volumes:
      # Persists Spotify Developer App credentials across restarts
      - ./server/.env:/app/server/.env

